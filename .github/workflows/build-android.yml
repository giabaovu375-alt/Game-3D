name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.2.2"
  EXPORT_NAME: "last-beacon"

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Godot Android export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Setup debug keystore
        run: |
          mkdir -v -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -storetype JKS
          echo "Keystore real path:"
          find ~ -iname "debug.keystore"

      - name: Find Java home
        run: |
          echo "JAVA_HOME currently: ${JAVA_HOME:-not set}"
          which java || true
          readlink -f "$(which java)" || true
          find / -maxdepth 4 -iname "javac" 2>/dev/null || true

      - name: Import project
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --import

      - name: Configure Editor Settings (Java SDK + debug keystore)
        run: |
          GODOT_CONFIG_DIR="$HOME/.config/godot"
          mkdir -v -p "$GODOT_CONFIG_DIR"
          REAL_JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(which java)")")")
          echo "Detected JAVA_HOME: $REAL_JAVA_HOME"
          echo "Detected keystore path: $HOME/.android/debug.keystore"
          cat > "$GODOT_CONFIG_DIR/editor_settings-4.tres" << INNEREOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$REAL_JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          INNEREOF
          echo "--- content written ---"
          cat "$GODOT_CONFIG_DIR/editor_settings-4.tres"
          echo "--- checking godot actually reads this dir ---"
          find / -iname "editor_settings-4.tres" 2>/dev/null

      - name: Export APK
        run: |
          godot --headless --verbose --export-debug "Android" build/android/${EXPORT_NAME}.apk

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-apk
          path: build/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 14
          if-no-files-found: ignore
