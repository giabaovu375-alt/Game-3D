name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.2.2"
  EXPORT_NAME: "last-beacon"

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Godot Android export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Setup debug keystore
        run: |
          mkdir -v -p /root/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keystore /root/.android/debug.keystore -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -storetype JKS

      - name: Import project
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --import

      - name: Export APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --verbose --export-debug "Android" build/android/${EXPORT_NAME}.apk
          echo "--- checking output file ---"
          ls -la build/android/

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-apk
          path: build/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 14
          if-no-files-found: warn
