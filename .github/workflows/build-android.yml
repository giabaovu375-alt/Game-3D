name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.2.2"
  EXPORT_NAME: "last-beacon"

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Godot Android export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Setup debug keystore
        run: |
          mkdir -v -p /root/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keystore /root/.android/debug.keystore -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -storetype JKS

      - name: Import project
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --import

      - name: Patch export_presets with real paths
        run: |
          set +e
          sed -i 's#keystore/debug=.*#keystore/debug="/root/.android/debug.keystore"#' export_presets.cfg
          sed -i 's#keystore/debug_user=.*#keystore/debug_user="androiddebugkey"#' export_presets.cfg
          sed -i 's#keystore/debug_password=.*#keystore/debug_password="android"#' export_presets.cfg
          echo "--- final export_presets.cfg ---"
          cat export_presets.cfg

      - name: Export APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set +e
          godot --headless --verbose --export-debug "Android" build/android/${EXPORT_NAME}.apk 2>&1 | tee /root/export_log.txt
          echo "--- exit status: $? ---"
          echo "--- checking output file ---"
          ls -la build/android/ || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-apk
          path: build/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 14
          if-no-files-found: warn
