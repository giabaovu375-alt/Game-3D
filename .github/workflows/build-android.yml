name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.2.2"
  EXPORT_NAME: "last-beacon"

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug environment
        run: |
          echo "--- find debug.keystore ---"
          find / -iname "*.keystore" 2>/dev/null
          echo "--- ANDROID env vars ---"
          env | grep -i android || true
          echo "--- JAVA env vars ---"
          env | grep -i java || true
          echo "--- godot version ---"
          godot --version

      - name: Setup Godot Android export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Setup debug keystore
        run: |
          mkdir -v -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -storetype JKS

      - name: Import project
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --import

      - name: Debug Godot config location
        run: |
          find / -iname "editor_settings*" 2>/dev/null
          find / -iname "*.tres" -path "*godot*" 2>/dev/null

      - name: Export APK
        run: |
          godot --headless --verbose --export-debug "Android" build/android/${EXPORT_NAME}.apk
